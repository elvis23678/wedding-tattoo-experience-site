<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070503">
<meta name="wte-release" content="1.0.0">
<title>Aggiornamento in corso - Wedding Tattoo Experience</title>
<style>
:root{--bg:#070503;--card:#100c08;--gold:#d3a64f;--text:#f3eadb;--muted:#a99a84;--line:rgba(211,166,79,.25)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,rgba(211,166,79,.13),transparent 36%),var(--bg);color:var(--text);font-family:Arial,sans-serif}
main{width:min(640px,calc(100% - 28px));padding:28px;border:1px solid var(--line);background:var(--card);text-align:center}
.logo{width:92px;height:auto}
small{display:block;margin-top:18px;color:var(--gold);font-size:9px;letter-spacing:.17em;text-transform:uppercase}
h1{margin:9px 0;font-family:Georgia,serif;font-size:37px;font-weight:400}
p{color:var(--muted);line-height:1.65}
button{width:100%;min-height:52px;margin-top:14px;border:0;background:linear-gradient(135deg,#f2dfad,#cc9f48,#a87526);color:#171006;font-weight:800}
</style>
</head>
<body>
<main>
<img class="logo" src="/logo.png" alt="Wedding Tattoo Experience">
<small>Wedding Tattoo Experience</small>
<h1>Aggiornamento in corso</h1>
<p id="message">Stiamo completando un breve aggiornamento. La prenotazione tornerà disponibile tra poco.</p>
<button type="button" onclick="location.reload()">Riprova</button>
</main>
<script>
fetch('https://wte-cloud-api.onrender.com/api/public/release-info',{cache:'no-store'})
 .then(response=>response.json())
 .then(data=>{
   if(!data.maintenance){
     location.href='/';
     return;
   }
   if(data.message){
     document.getElementById('message').textContent=data.message;
   }
 })
 .catch(()=>{});
</script>
</body>
</html>

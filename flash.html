<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Selezione Flash - Wedding Tattoo Experience</title>
<style>
:root{--bg:#070503;--card:#100c08;--gold:#d3a64f;--text:#f3eadb;--muted:#a99a84;--line:rgba(211,166,79,.25)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;padding:15px;background:rgba(7,5,3,.95);border-bottom:1px solid var(--line)}
header small{color:var(--gold);letter-spacing:.16em;text-transform:uppercase}
header h1{margin:6px 0;font-family:Georgia,serif;font-weight:400}
.counter{font-weight:700;color:var(--gold)}
main{padding:12px;max-width:1100px;margin:auto}.notice{padding:13px;border:1px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.card{position:relative;padding:8px;border:1px solid var(--line);background:var(--card)}
.card.selected{outline:2px solid var(--gold)}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff}
.card strong{display:block;margin-top:7px}.card button{width:100%;min-height:40px;margin-top:7px;border:0;background:#1a130c;color:var(--text)}
.card.selected button{background:var(--gold);color:#171006}
.form{margin-top:18px;padding:15px;border:1px solid var(--line);background:var(--card)}
input{width:100%;min-height:48px;padding:0 10px;background:#080604;border:1px solid var(--line);color:#fff}
canvas{width:100%;height:180px;margin-top:10px;background:#fff;touch-action:none}
.actions{display:grid;gap:8px;margin-top:10px}.actions button{min-height:48px;border:1px solid var(--line);background:#0b0805;color:#fff}
.actions .gold{border:0;background:linear-gradient(135deg,#f2dfad,#cc9f48,#a87526);color:#171006;font-weight:700}
.empty{padding:45px 15px;text-align:center;border:1px dashed var(--line);color:var(--muted);grid-column:1/-1}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:1fr 1fr 2fr}}
@media print{header,.notice,.form .actions{display:none}.grid{grid-template-columns:repeat(4,1fr)}body{background:#fff;color:#000}.card{break-inside:avoid;background:#fff;border:1px solid #aaa}.card:not(.selected){display:none}}
</style>
</head>
<body>
<header>
<small>Wedding Tattoo Experience</small>
<h1>Seleziona i flash per il tuo evento</h1>
<div><span class="counter" id="counter">0/50</span> selezionati</div>
</header>
<main>
<div class="notice" id="status">Caricamento sessione...</div>
<div class="grid" id="grid"></div>
<section class="form">
<h2>Conferma e firma</h2>
<p>La selezione sarà bloccata dopo la conferma. Il numero effettivo di tatuaggi dipende dalla durata e dall'organizzazione dell'evento.</p>
<input id="customerName" placeholder="Nome e cognome">
<canvas id="signature"></canvas>
<div class="actions">
<button id="clear">Cancella firma</button>
<button id="print">Stampa / PDF</button>
<button class="gold" id="confirm">Firma e conferma selezione</button>
</div>
</section>
</main>
<script>
const API='https://wte-cloud-api.onrender.com';
const token=new URLSearchParams(location.search).get('token');
let session=null,catalog=[],selected=new Set(),drawing=false;
const grid=document.getElementById('grid'),canvas=document.getElementById('signature'),ctx=canvas.getContext('2d');
function resize(){const r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round'}
resize();addEventListener('resize',resize);
function pos(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]}
canvas.onpointerdown=e=>{drawing=true;ctx.beginPath();ctx.moveTo(...pos(e))};
canvas.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke()};
canvas.onpointerup=canvas.onpointerleave=()=>drawing=false;
clear.onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
print.onclick=()=>print();
function update(){counter.textContent=`${selected.size}/${session?.max_items||50}`}
function render(){
 grid.innerHTML='';
 if(!catalog.length){grid.innerHTML='<div class="empty">Il catalogo flash non contiene ancora elementi attivi.</div>';return}
 catalog.forEach(item=>{
  const card=document.createElement('article');card.className='card'+(selected.has(item.code)?' selected':'');
  card.innerHTML=`<img src="${item.image}" alt="${item.code}"><strong>${item.code}</strong><span>${item.title||''}</span><button>${selected.has(item.code)?'Selezionato':'Seleziona'}</button>`;
  card.querySelector('button').onclick=()=>{
   if(selected.has(item.code))selected.delete(item.code);
   else if(selected.size<(session?.max_items||50))selected.add(item.code);
   else return alert('Hai raggiunto il limite massimo.');
   render();update();
  };grid.appendChild(card);
 })
}
async function init(){
 if(!token){status.textContent='Link non valido.';return}
 const [s,c]=await Promise.all([fetch(`${API}/api/public/flash-session/${token}`).then(r=>r.json()),fetch(`${API}/api/public/flash-catalog`).then(r=>r.json())]);
 if(s.error){status.textContent=s.error;return}
 session=s.session;catalog=c.items||[];selected=new Set(session.selections||[]);
 customerName.value=session.customer_name||'';
 status.textContent=session.locked?'Selezione già confermata. Puoi stamparla.':`Puoi scegliere fino a ${session.max_items} flash.`;
 if(session.locked){confirm.disabled=true}
 update();render()
}
confirm.onclick=async()=>{
 if(!customerName.value.trim())return alert('Inserisci nome e cognome.');
 if(!selected.size)return alert('Seleziona almeno un flash.');
 const signatureData=canvas.toDataURL('image/png');
 const res=await fetch(`${API}/api/public/flash-session/${token}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selections:[...selected],customerName:customerName.value.trim(),signatureData,accepted:true})});
 const data=await res.json();if(!res.ok)return alert(data.error||'Errore');
 alert('Selezione confermata. Ora puoi salvarla in PDF.');confirm.disabled=true;status.textContent='Selezione confermata e firmata.';
};
init().catch(e=>status.textContent='Errore di collegamento: '+e.message);
</script>
</body></html>

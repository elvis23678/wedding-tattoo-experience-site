<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070503"><title>La vostra Area Sposi - Wedding Tattoo Experience</title>
<style>

:root{
  --bg:#050302;--panel:#0f0a07;--panel2:#171008;
  --gold:#d4aa56;--gold2:#fff0bd;--deep:#9c681f;
  --text:#f7f0e5;--muted:#bcae99;--line:rgba(221,181,96,.24);
  --ok:#a9d0ad;--bad:#e5a7a7;
  --serif:Georgia,"Times New Roman",serif;--sans:Arial,sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0,rgba(212,170,86,.11),transparent 34%),
    var(--bg);
  color:var(--text);font-family:var(--sans)
}
main{max-width:920px;margin:auto;padding:24px 14px 70px}
.brand{color:var(--gold2);font-size:9px;letter-spacing:.18em;text-transform:uppercase}
h1{margin:9px 0 6px;font-family:var(--serif);font-size:clamp(40px,10vw,62px);font-weight:400}
.intro{margin:0;color:var(--muted)}
.hero,.panel{
  margin-top:14px;padding:18px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(22,15,10,.95),rgba(10,7,5,.97))
}
.hero strong{display:block;font-family:var(--serif);font-size:28px;font-weight:400}
.hero span{display:block;margin-top:6px;color:var(--muted)}
.countdown{margin-top:13px;color:var(--gold2);font-family:var(--serif);font-size:28px}
.next-action{margin-top:11px;padding:11px;border:1px solid rgba(221,181,96,.22);color:#dbcdb9;font-size:12px}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.timeline article{padding:10px 6px;border:1px solid rgba(221,181,96,.13);text-align:center}
.timeline span{display:block;font-size:18px}
.timeline strong{display:block;margin-top:5px;font-size:9px}
.timeline .done{border-color:rgba(169,208,173,.38);color:var(--ok)}
.timeline .current{border-color:var(--gold);color:var(--gold2)}
.timeline .locked{opacity:.42}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:400}
.metric{margin-top:11px;color:var(--gold2);font-size:32px;font-weight:900}
.panel p{color:var(--muted);line-height:1.55}
.actions{display:grid;gap:8px;margin-top:12px}
.actions a{
  min-height:50px;display:grid;place-items:center;
  border:1px solid var(--line);color:#fff;text-decoration:none;text-align:center;padding:0 8px
}
.actions .gold{
  border:1px solid rgba(255,237,190,.45);
  background:linear-gradient(135deg,#fff0bd,#d8aa4d 56%,#9c681f);
  color:#171006;font-weight:900
}
.qr{display:block;width:min(230px,100%);margin:12px auto;padding:8px;background:#fff}
.empty{color:var(--muted)}
@media(max-width:700px){.timeline{grid-template-columns:1fr}.timeline article{text-align:left;display:flex;gap:9px;align-items:center}.grid{grid-template-columns:1fr}}

</style><meta name="wte-release" content="1.0.0">

<script>
(async()=>{
 try{
  const response=await fetch(
   'https://wte-cloud-api.onrender.com/api/public/release-info',
   {cache:'no-store'}
  );
  const release=await response.json();
  if(release.maintenance && !location.pathname.endsWith('/maintenance.html')){
   location.replace('/maintenance.html');
  }
 }catch{}
})();
</script>

<script src="/wte-analytics.js" defer></script>
</head>
<body><main>
<div class="brand">Wedding Tattoo Experience</div><h1>Area Sposi</h1><p class="intro">Qui trovate solo ciò che serve, nel momento giusto.</p>
<section class="hero">
<strong id="name">Caricamento…</strong>
<span id="event"></span>
<div class="countdown" id="countdown"></div>
<div class="next-action" id="nextAction"></div>
<div class="timeline" id="timeline"></div>
</section>
<div class="grid">
<section class="panel"><h2>Pagamenti</h2><div id="payments"></div><div class="actions" id="paymentActions"></div></section>
<section class="panel"><h2>Invitati e flash</h2><div class="metric" id="flashMetric">0</div><p id="flashText">La selezione si attiva dopo l’acconto.</p><img class="qr" id="qr" hidden><div class="actions" id="guestActions"></div></section>
<section class="panel"><h2>Documenti</h2><p>Contratto, ricevute e PDF definitivo restano disponibili qui.</p><div class="actions" id="documents"></div></section>
<section class="panel"><h2>Stato pratica</h2><p id="statusText">Verifica in corso…</p></section>
</div>
</main>
<script>
const API='https://wte-cloud-api.onrender.com';
const token=new URLSearchParams(location.search).get('token');
const $=id=>document.getElementById(id);

function removeDuplicateDocumentPanels(){
 const panels=[...document.querySelectorAll('.panel')].filter(panel=>
  panel.querySelector('h2')?.textContent.trim().toLowerCase()==='documenti'
 );
 panels.slice(1).forEach(panel=>panel.remove());
}
const euro=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v||0)/100);
function daysUntil(value){
 const target=value?new Date(`${value}T12:00:00`):null;
 if(!target||Number.isNaN(target.getTime()))return null;
 return Math.ceil((target-Date.now())/86400000);
}
function link(url,label,gold=false){return url?`<a ${gold?'class="gold"':''} href="${url}" target="_blank" rel="noopener">${label}</a>`:''}
function actionButton(id,label,gold=false){return `<a href="#" id="${id}" ${gold?'class="gold"':''}>${label}</a>`}
async function startCheckout(type){
 const response=await fetch(`${API}/api/public/payment-plan/${encodeURIComponent(token||'')}/checkout`,{
  method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type})
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||'Impossibile avviare il pagamento.');
 if(!data.checkoutUrl)throw new Error('Link di pagamento non disponibile.');
 location.href=data.checkoutUrl;
}
async function load(){
 removeDuplicateDocumentPanels();
 WTEAnalytics?.track('couple_area_opened');
 const response=await fetch(`${API}/api/public/couple/${encodeURIComponent(token||'')}`,{cache:'no-store'});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||'Area Sposi non disponibile.');
 const b=data.booking,g=data.guest;
 $('name').textContent=b.customerName||'La vostra pratica';
 $('event').textContent=[b.eventDate,b.eventTime,b.location].filter(Boolean).join(' · ');
 const days=daysUntil(b.eventDate);
 $('countdown').textContent=days===null?'':days>0?`${days} giorni al matrimonio`:days===0?'Oggi è il grande giorno':'Evento concluso';
 $('nextAction').textContent=
   b.depositStatus!=='paid'
    ?'Prossimo passo: completare l’acconto.'
    :g.status!=='finalized'
      ?'Prossimo passo: condividere il QR con gli invitati.'
      :b.balanceStatus!=='paid'
        ?'Prossimo passo: completare il saldo entro la scadenza.'
        :'Tutto pronto per l’evento.';
 $('timeline').innerHTML=data.steps.map(s=>`<article class="${s.status}"><span>${s.status==='done'?'✓':s.status==='current'?'●':'○'}</span><strong>${s.label}</strong></article>`).join('');
 $('payments').innerHTML=`<p>Acconto: <strong>${euro(b.depositCents)}</strong> · ${b.depositStatus==='paid'?'ricevuto':'in attesa'}</p><p>Saldo: <strong>${euro(b.balanceCents)}</strong> · ${b.balanceStatus==='paid'?'ricevuto':'in attesa'}</p>`;
 $('paymentActions').innerHTML=
   (b.depositStatus!=='paid'?actionButton('payDeposit','Paga l’acconto',true):'')+
   (b.depositStatus==='paid'&&b.balanceStatus!=='paid'?actionButton('payBalance','Paga il saldo',true):'');
 const payDeposit=$('payDeposit');
 if(payDeposit)payDeposit.onclick=async e=>{e.preventDefault();payDeposit.textContent='Apertura pagamento…';try{await startCheckout('deposit')}catch(err){alert(err.message);payDeposit.textContent='Paga l’acconto'}};
 const payBalance=$('payBalance');
 if(payBalance)payBalance.onclick=async e=>{e.preventDefault();payBalance.textContent='Apertura pagamento…';try{await startCheckout('balance')}catch(err){alert(err.message);payBalance.textContent='Paga il saldo'}};
 $('flashMetric').textContent=g.status==='finalized'?`${g.finalCount} flash`:`${g.uniqueFlash} preferenze`;
 $('flashText').textContent=g.enabled?`Catalogo aperto${g.closesAt?' fino al '+new Date(g.closesAt).toLocaleDateString('it-IT'):''}. Condividete il QR con gli invitati.`:'La selezione sarà disponibile dopo la registrazione dell’acconto.';
 if(g.qrUrl){$('qr').src=g.qrUrl;$('qr').hidden=false;$('qr').onerror=()=>{$('qr').hidden=true;$('flashText').textContent+=' Il QR non è visualizzabile, ma il link invitati qui sotto resta attivo.'}}
 $('guestActions').innerHTML=
   link(g.catalogUrl,'Apri catalogo invitati',true)+
   (g.catalogUrl?'<a href="#" id="copyGuestLink">Copia link per gli invitati</a>':'')+
   link(g.finalPdf,'Apri PDF flash');
 const copyButton=$('copyGuestLink');
 if(copyButton){
  copyButton.onclick=async event=>{
   event.preventDefault();
   await navigator.clipboard.writeText(g.catalogUrl);
   copyButton.textContent='Link copiato ✓';
  };
 }
 $('documents').innerHTML=link(b.contractPdf,'Contratto PDF')+link(b.depositReceiptUrl,'Ricevuta acconto')+link(b.balanceReceiptUrl,'Ricevuta saldo')+link(g.finalPdf,'PDF flash definitivo');
 $('statusText').textContent=b.bookingStatus==='ready'?'Pratica completa: tutto pronto per l’evento.':b.depositStatus==='paid'?'Prenotazione confermata. Il sistema gestirà automaticamente flash e saldo.':'Contratto accettato. La prenotazione sarà confermata dopo l’acconto.';
}
load().catch(error=>{$('name').textContent='Errore';$('event').textContent=error.message});
setInterval(()=>load().catch(()=>{}),30000);
</script>
<script>
window.addEventListener('unhandledrejection',event=>{
  console.error('WTE unhandled rejection',event.reason);
});
window.addEventListener('error',event=>{
  console.error('WTE frontend error',event.error||event.message);
});
</script>

</body></html>

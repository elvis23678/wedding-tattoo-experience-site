services:
  - type: web
    name: wte-cloud-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run init-db && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wte-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://www.weddingtattooexperience.it

databases:
  - name: wte-postgres
    plan: free
    region: frankfurt
    databaseName: wte
    user: wte
    ipAllowList: []

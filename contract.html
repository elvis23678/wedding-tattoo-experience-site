<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070503">
<title>Contratto - Wedding Tattoo Experience</title>
<style>

:root{
  --bg:#050302;--panel:#0f0a07;--panel2:#171008;
  --gold:#d4aa56;--gold2:#fff0bd;--deep:#9c681f;
  --text:#f7f0e5;--muted:#bcae99;--line:rgba(221,181,96,.24);
  --ok:#a9d0ad;--bad:#e5a7a7;
  --serif:Georgia,"Times New Roman",serif;--sans:Arial,sans-serif;
}

*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 50% 0,rgba(212,170,86,.12),transparent 34%),
    var(--bg);
  color:var(--text);font-family:var(--sans)
}
main{max-width:820px;margin:auto;padding:24px 14px 70px}
.brand{color:var(--gold2);font-size:9px;letter-spacing:.19em;text-transform:uppercase}
h1{margin:9px 0 6px;font-family:var(--serif);font-size:clamp(38px,10vw,62px);font-weight:400;line-height:1.02}
.intro{margin:0;color:var(--muted);line-height:1.6}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}
.journey span{padding:8px 5px;border:1px solid var(--line);font-size:9px;text-align:center;color:var(--muted)}
.journey .done{color:var(--ok);border-color:rgba(169,208,173,.38)}
.journey .current{color:var(--gold2);border-color:var(--gold)}
.summary,.terms,.sign,.success{
  margin-top:14px;padding:18px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(22,15,10,.95),rgba(10,7,5,.97));
  box-shadow:0 22px 70px rgba(0,0,0,.30)
}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.summary-grid div{padding:12px;border:1px solid rgba(221,181,96,.14)}
.summary-grid span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}
.summary-grid strong{display:block;margin-top:5px;font-size:14px}
h2{margin:0 0 10px;font-family:var(--serif);font-size:28px;font-weight:400}
.terms{color:#d7cbb8;line-height:1.65;font-size:13px}
label{display:grid;gap:7px;margin-top:12px;color:#c8b9a4;font-size:9px;text-transform:uppercase}
input{width:100%;min-height:54px;padding:0 13px;background:#080503;border:1px solid var(--line);color:#fff;font-size:17px}
.accept{display:flex;gap:10px;align-items:flex-start;color:#d8ccb8;font-size:13px;line-height:1.5;text-transform:none}
.accept input{width:22px;height:22px;flex:0 0 auto}
canvas{width:100%;height:190px;margin-top:10px;background:#fff;touch-action:none}
.actions{display:grid;gap:9px;margin-top:14px}
button,a{
  min-height:54px;display:grid;place-items:center;
  border:1px solid var(--line);background:#0b0805;color:#fff;
  text-decoration:none;text-align:center;font-weight:800
}
.gold{
  border:1px solid rgba(255,237,190,.45);
  background:linear-gradient(135deg,#fff0bd,#d8aa4d 56%,#9c681f);
  color:#171006;box-shadow:0 0 28px rgba(212,170,86,.13)
}
.secondary-link{background:transparent!important;border:0!important;color:var(--muted)!important;text-decoration:underline!important;font-weight:400!important}
.success{display:none;text-align:center;border-color:rgba(169,208,173,.40)}
.success.show{display:block}
.step-badge{display:inline-block;margin-bottom:9px;padding:6px 8px;border:1px solid rgba(212,170,86,.28);color:var(--gold2);font-size:8px;letter-spacing:.12em;text-transform:uppercase}
.auto-forward{margin-top:14px;padding:15px;border:1px solid rgba(169,208,173,.34);background:rgba(169,208,173,.045);text-align:center}
.auto-forward span{display:block;color:var(--muted);font-size:9px;letter-spacing:.11em;text-transform:uppercase}
.auto-forward strong{display:block;margin-top:6px;color:var(--ok);font-family:var(--serif);font-size:38px;font-weight:400}
.auto-forward button{min-height:38px;margin:8px auto 0;padding:0 12px;border:0;background:transparent;color:var(--muted);text-decoration:underline;font-weight:400}
.note{margin-top:12px;color:var(--muted);font-size:10px;line-height:1.45}
@media(max-width:620px){.summary-grid,.journey{grid-template-columns:1fr}.journey span{text-align:left}}

</style>
<meta name="wte-release" content="1.0.0">

<script>
(async()=>{
 try{
  const response=await fetch(
   'https://wte-cloud-api.onrender.com/api/public/release-info',
   {cache:'no-store'}
  );
  const release=await response.json();
  if(release.maintenance && !location.pathname.endsWith('/maintenance.html')){
   location.replace('/maintenance.html');
  }
 }catch{}
})();
</script>

<script src="/wte-analytics.js" defer></script>
</head>
<body>
<main>
<header>
<small>Wedding Tattoo Experience</small>
<h1 id="title">Bozza di contratto</h1>
<p id="status">Caricamento…</p>
<div class="journey">
<span class="done">1. Proposta</span>
<span class="current">2. Contratto</span>
<span>3. Acconto</span>
<span>4. Area Sposi</span>
</div>
</header>
<section class="summary">
<h2>Riepilogo</h2>
<div class="summary-grid" id="summary"></div>
</section>
<section class="terms" id="terms"></section>
<section class="sign" id="signSection">
<div class="step-badge">Ultimo passaggio prima della conferma</div>
<h2>Accettazione e firma</h2>
<input id="signerName" type="text" placeholder="Nome e cognome del firmatario">
<label class="accept"><input id="accepted" type="checkbox"> Confermo di aver letto e accettato integralmente le condizioni riportate nel contratto.</label>
<p>Firma nel riquadro bianco:</p>
<canvas id="signature"></canvas>
<div class="actions">
<button id="clear" type="button">Cancella firma</button>
<button class="gold" id="confirm" type="button">Firma e continua</button>
</div>
</section>
<div class="success" id="success"></div>
<div class="auto-forward" id="autoForward" hidden>
  <span>Proseguimento automatico al pagamento</span>
  <strong id="forwardCountdown">4</strong>
  <button id="cancelForward" type="button">Resta su questa pagina</button>
</div>
<div class="actions">
<a class="gold" id="paymentLink" hidden>Continua ora</a>
<a class="secondary-link" id="pdfLink" target="_blank">Scarica il contratto PDF</a>
</div>
</main>
<script>
const API='https://wte-cloud-api.onrender.com';
const token=new URLSearchParams(location.search).get('token');
const $=id=>document.getElementById(id);
const canvas=$('signature'),ctx=canvas.getContext('2d');
let contract=null,drawing=false,hasInk=false,forwardTimer=null;
function resize(){
 const rect=canvas.getBoundingClientRect();
 const ratio=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(rect.width*ratio);
 canvas.height=Math.round(rect.height*ratio);
 ctx.setTransform(ratio,0,0,ratio,0,0);
 ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111';
}
function position(event){
 const rect=canvas.getBoundingClientRect();
 return[event.clientX-rect.left,event.clientY-rect.top];
}
canvas.onpointerdown=event=>{drawing=true;hasInk=true;ctx.beginPath();ctx.moveTo(...position(event));canvas.setPointerCapture?.(event.pointerId)};
canvas.onpointermove=event=>{if(!drawing)return;ctx.lineTo(...position(event));ctx.stroke()};
canvas.onpointerup=canvas.onpointercancel=canvas.onpointerleave=()=>drawing=false;
$('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false};
addEventListener('resize',resize);
async function init(){
 if(!token)throw new Error('Link contratto non valido.');
 const response=await fetch(`${API}/api/public/contracts/${encodeURIComponent(token)}`,{cache:'no-store'});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||'Contratto non disponibile.');
 contract=data.contract;
 $('pdfLink').href=data.pdf;
 $('status').textContent=`Contratto ${contract.contractNumber}`;
 const customer=contract.customer||{},pack=contract.package||{};
 const fields=[
  ['Cliente',customer.name],['Data evento',customer.date],['Ora',customer.time],
  ['Luogo',customer.location],['Invitati',customer.guests],
  ['Pacchetto',pack.name],['Importo',pack.price_cents?new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(pack.price_cents/100):'Su misura']
 ];
 $('summary').innerHTML=fields.map(([label,value])=>`<div><span>${label}</span><strong>${value||'—'}</strong></div>`).join('');
 $('terms').innerHTML=(contract.clauses||[]).map((clause,index)=>`<article class="clause"><h3>${index+1}. ${clause.title}</h3><p>${clause.text}</p></article>`).join('');
 $('signerName').value=contract.signerName||customer.name||'';
 if(contract.status==='accepted'){
  $('title').textContent='Contratto accettato';
  $('status').textContent=`Firmato il ${new Date(contract.acceptedAt).toLocaleString('it-IT')}`;
  $('signSection').style.display='none';
  $('success').textContent='Il contratto risulta già accettato. Puoi scaricarne una copia firmata.';
  $('success').classList.add('show');
  WTEAnalytics?.track('contract_signed');
 }
 requestAnimationFrame(resize);
}
function startAutoForward(url){
 if(!url)return;
 const box=$('autoForward');
 const count=$('forwardCountdown');
 let remaining=4;
 box.hidden=false;
 count.textContent=remaining;
 if(forwardTimer)clearInterval(forwardTimer);
 forwardTimer=setInterval(()=>{
  remaining-=1;
  count.textContent=remaining;
  if(remaining<=0){
   clearInterval(forwardTimer);
   forwardTimer=null;
   location.href=url;
  }
 },1000);
 $('cancelForward').onclick=()=>{
  if(forwardTimer)clearInterval(forwardTimer);
  forwardTimer=null;
  box.hidden=true;
 };
}
$('confirm').onclick=async()=>{
 WTEAnalytics?.track('contract_signature_started');
 if(!$('signerName').value.trim())return alert('Inserisci il nome del firmatario.');
 if(!$('accepted').checked)return alert('Devi accettare le condizioni.');
 if(!hasInk)return alert('Inserisci la firma.');
 const button=$('confirm');
 button.disabled=true;button.textContent='Registrazione…';
 try{
  const response=await fetch(`${API}/api/public/contracts/${encodeURIComponent(token)}/accept`,{
   method:'POST',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify({
    signerName:$('signerName').value.trim(),
    signatureData:canvas.toDataURL('image/png'),
    accepted:true
   })
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'Firma non registrata.');
  $('signSection').style.display='none';
  $('pdfLink').href=data.contractPdf;
  $('paymentLink').href=data.paymentUrl;
  $('paymentLink').hidden=!data.paymentUrl;
  if(data.coupleUrl)localStorage.setItem('wte_couple_url',data.coupleUrl);
  $('title').textContent='Contratto accettato';
  $('status').textContent='Firma registrata correttamente';
  $('success').innerHTML=
   `Contratto registrato. L’acconto è <strong>${new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format((data.depositCents||0)/100)}</strong> `+
   `con scadenza ${new Date(data.depositDueAt).toLocaleDateString('it-IT')}.`;
  $('success').classList.add('show');
  startAutoForward(data.paymentUrl);
 }catch(error){
  alert(error.message);
 }finally{
  button.disabled=false;button.textContent='Firma e continua';
 }
};
init().catch(error=>{
 $('status').textContent=error.message;
 $('signSection').style.display='none';
});
</script>

<script>
window.addEventListener('unhandledrejection',event=>{
  console.error('WTE unhandled rejection',event.reason);
});
window.addEventListener('error',event=>{
  console.error('WTE frontend error',event.error||event.message);
});
</script>

</body>
</html>
